<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lurelle Manager Login</title>


<style>

body {
    margin: 0;

    min-height: 100vh;

    background-color: #FFF8F3;

    color: #6F5A4D;

    font-family: Georgia, serif;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* LOGIN AREA */

.login-container {

    width: 90%;

    max-width: 430px;

    text-align: center;

}


/* LOGO */

.logo {

    width: 150px;

    height: 150px;

    object-fit: cover;

    border-radius: 50%;

    margin-bottom: 25px;

}


/* SMALL TITLE */

.small-title {

    margin: 0 0 10px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color: #A28E84;

}


/* MAIN TITLE */

h1 {

    margin: 0;

    font-size: 42px;

    font-weight: normal;

}


/* SUBTITLE */

.subtitle {

    margin: 12px 0 35px;

    font-size: 16px;

    font-style: italic;

    color: #8A7468;

}


/* LOGIN BOX */

.login-box {

    background-color: rgba(255,255,255,0.65);

    border: 1px solid #E5D6CD;

    border-radius: 30px;

    padding: 30px;

    box-shadow:
        0 8px 25px
        rgba(111,90,77,0.08);

}


/* INPUTS */

input {

    width: 100%;

    box-sizing: border-box;

    padding: 15px 17px;

    margin-bottom: 15px;

    border: 1px solid #E5D6CD;

    border-radius: 18px;

    background-color: #FFF8F3;

    color: #6F5A4D;

    font-family: Arial, sans-serif;

    font-size: 15px;

    outline: none;

}


input:focus {

    border-color: #DCC9BE;

}


/* LOGIN BUTTON */

.login-button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 20px;

    background-color: #DCC9BE;

    color: #FFF8F3;

    font-family: Georgia, serif;

    font-size: 17px;

    cursor: pointer;

    transition:
        background-color 0.3s ease,
        transform 0.3s ease;

}


.login-button:hover {

    background-color: #C98F9F;

    transform: translateY(-2px);

}


/* LITTLE FOOTER */

.footer-note {

    margin-top: 25px;

    font-size: 14px;

    font-style: italic;

    color: #A28E84;

}

</style>

</head>


<body>


<div class="login-container">


    <!-- YOUR LURELLE LOGO -->

    <img
        class="logo"
        src="C:\Users\Ebehi\Downloads\ADEL'S STUFF( DONT OPEN )\MY BUSINESS\CROCHET BUSINESS\New folder\lurelle-logo.jpg.JPG"
    >


    <p class="small-title">
        behind the scenes
    </p>


    <h1>
        Lurelle Manager ♡
    </h1>


    <p class="subtitle">
        a little space just for Lurelle
    </p>


    <!-- LOGIN BOX -->

    <div class="login-box">


        <input
            id="email"
            type="email"
            placeholder="Manager email"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <button
            class="login-button"
            onclick="loginManager()"
        >
            Log in ♡
        </button>


    </div>


    <p class="footer-note">
        ♡ made behind the scenes
    </p>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ljzydmylrayqdvuxtzps.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_RNQQFOqPdrKbLd6HiMSmwg_6UUNBZqg";



/* =========================
   LOGIN
========================= */

async function loginManager() {


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if (!email || !password) {

        alert(
            "Please enter your email and password. ♡"
        );

        return;

    }


    try {


        const response =
            await fetch(
                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY

                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                }
            );


        const data =
            await response.json();


        /*
        =========================
        LOGIN FAILED
        =========================
        */

        if (!response.ok) {

            console.error(
                "Login failed:",
                data
            );


            alert(
                "Sorry, that login doesn't look right. ♡"
            );

            return;

        }


        /*
        =========================
        SAVE ACCESS TOKEN
        =========================
        */

        localStorage.setItem(
            "lurelle_access_token",
            data.access_token
        );


        /*
        =========================
        SAVE REFRESH TOKEN
        =========================
        */

        if (data.refresh_token) {

            localStorage.setItem(
                "lurelle_refresh_token",
                data.refresh_token
            );

        }


        /*
        =========================
        SAVE TOKEN EXPIRATION
        =========================
        */

        if (data.expires_in) {


            const expiresAt =
                Date.now() +
                (
                    data.expires_in *
                    1000
                );


            localStorage.setItem(
                "lurelle_token_expires_at",
                String(expiresAt)
            );

        }


        /*
        =========================
        GO TO MANAGER
        =========================
        */

        window.location.href =
            "manager.html";


    }


    catch (error) {


        console.error(
            "Login error:",
            error
        );


        alert(
            "Something went wrong. Please try again. ♡"
        );

    }

}

</script>


</body>
</html>
