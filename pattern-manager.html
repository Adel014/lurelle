<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pattern Manager | Lurelle</title>

<style>

body {
    margin: 0;
    background-color: #FFF8F3;
    color: #6F5A4D;
    font-family: Georgia, serif;
}

.manager-page {
    min-height: 100vh;
    padding: 60px 25px 80px;
    box-sizing: border-box;
}

.back-button {
    display: inline-block;
    margin-bottom: 35px;
    color: #6F5A4D;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.back-button:hover {
    color: #C98F9F;
}

.title-area {
    text-align: center;
    margin-bottom: 45px;
}

.small-title {
    margin: 0 0 10px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A28E84;
}

h1 {
    margin: 0;
    font-size: clamp(40px, 7vw, 65px);
    font-weight: normal;
}

.subtitle {
    margin: 12px auto 0;
    max-width: 550px;
    font-size: 16px;
    font-style: italic;
    line-height: 1.7;
    color: #8A7468;
}

.form-box {
    max-width: 700px;
    margin: 0 auto;

    background-color: rgba(255,255,255,0.65);

    border: 1px solid #E5D6CD;

    border-radius: 30px;

    padding: 35px;

    box-shadow: 0 8px 25px rgba(111,90,77,0.08);

    box-sizing: border-box;
}

label {
    display: block;
    margin: 0 0 8px;

    font-family: Arial, sans-serif;

    font-size: 13px;

    color: #806B60;
}

input,
textarea {

    width: 100%;

    box-sizing: border-box;

    padding: 14px 16px;

    margin-bottom: 22px;

    border: 1px solid #E5D6CD;

    border-radius: 17px;

    background-color: #FFF8F3;

    color: #6F5A4D;

    font-family: Arial, sans-serif;

    font-size: 15px;

    outline: none;
}

input:focus,
textarea:focus {
    border-color: #DCC9BE;
}

#patternDescription {
    min-height: 100px;
    resize: vertical;
}

#patternInstructions {
    min-height: 300px;
    resize: vertical;
    line-height: 1.7;
}

.photo-note {
    margin: -12px 0 22px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 1.5;

    color: #A28E84;
}

.add-button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 20px;

    background-color: #DCC9BE;

    color: #FFF8F3;

    font-family: Georgia, serif;

    font-size: 17px;

    cursor: pointer;

    transition:
        background-color 0.3s ease,
        transform 0.3s ease;
}

.add-button:hover {

    background-color: #C98F9F;

    transform: translateY(-2px);
}

#message {

    text-align: center;

    margin-top: 20px;

    font-size: 14px;

    font-style: italic;

    color: #8A7468;
}

.pattern-list {

    max-width: 900px;

    margin: 70px auto 0;
}

.pattern-list .title-area {

    text-align: center;

    margin-bottom: 35px;
}

.pattern-list h2 {

    margin: 0;

    font-size: 38px;

    font-weight: normal;
}

.pattern-grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 22px;
}

.pattern-card {

    background-color: rgba(255,255,255,0.65);

    border: 1px solid #E5D6CD;

    border-radius: 25px;

    padding: 25px;

    text-align: left;

    box-shadow: 0 6px 20px rgba(111,90,77,0.06);
}

.pattern-card h3 {

    margin: 0 0 10px;

    font-size: 25px;

    font-weight: normal;
}

.pattern-description {

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.6;

    color: #8A7468;

    margin-bottom: 20px;
}

.pattern-instructions {

    white-space: pre-wrap;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.7;

    color: #6F5A4D;

    background-color: #FFF8F3;

    border: 1px solid #E5D6CD;

    border-radius: 17px;

    padding: 18px;
}

.pattern-actions {

    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.edit-button,
.delete-button {

    flex: 1;

    padding: 11px;

    border: none;

    border-radius: 15px;

    font-family: Arial, sans-serif;

    cursor: pointer;

    font-size: 14px;
}

.edit-button {

    background-color: #DCC9BE;

    color: #FFF8F3;
}

.delete-button {

    background-color: #E8C5CB;

    color: #6F5A4D;
}

.edit-button:hover,
.delete-button:hover {

    opacity: 0.8;
}

.loading-message {

    text-align: center;

    font-style: italic;

    color: #8A7468;
}

@media (max-width: 700px) {

    .pattern-grid {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<main class="manager-page">


<a href="manager.html" class="back-button">
    ← Back to Manager
</a>


<div class="title-area">

<p class="small-title">
    behind the scenes
</p>

<h1>
    Patterns ♡
</h1>

<p class="subtitle">
    Create, save and manage your Lurelle patterns.
</p>

</div>


<!-- =========================
     ADD PATTERN FORM
========================= -->

<div class="form-box">


<label for="patternName">
    Pattern name
</label>

<input
    id="patternName"
    type="text"
    placeholder="e.g. Lurelle Flower Bag"
>


<label for="patternDescription">
    Short description
</label>

<textarea
    id="patternDescription"
    placeholder="Tell us what this pattern makes..."
></textarea>


<label for="patternInstructions">
    Pattern instructions
</label>

<textarea
    id="patternInstructions"
    placeholder="Write your pattern here... 🧶✨"
></textarea>


<label for="patternPhoto">
    Pattern photos
</label>

<input
    id="patternPhoto"
    type="file"
    accept="image/*"
    multiple
>

<p class="photo-note">
    You can choose one or more photos. ♡
</p>


<button
    class="add-button"
    onclick="addPattern()"
>
    Add Pattern ♡
</button>


<p id="message"></p>


</div>


<!-- =========================
     SAVED PATTERNS
========================= -->

<section class="pattern-list">


<div class="title-area">

<p class="small-title">
    your patterns
</p>

<h2>
    Your Lurelle Patterns ♡
</h2>

<p class="subtitle">
    Your saved patterns will appear here.
</p>

</div>


<div id="patternList">

<p class="loading-message">
    Loading your patterns... ♡
</p>

</div>


</section>


</main>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ljzydmylrayqdvuxtzps.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    


/* =========================
   TEMPORARY EDIT/DELETE PASSWORD
========================= */

const PATTERN_MANAGER_PASSWORD =
    "Lurelle123";


/* =========================
   GET VALID LOGIN TOKEN
========================= */

async function getValidAccessToken() {

    let accessToken =
        localStorage.getItem(
            "lurelle_access_token"
        );

    const refreshToken =
        localStorage.getItem(
            "lurelle_refresh_token"
        );


    if (!accessToken || !refreshToken) {

        return null;

    }


    const expiresAt =
        Number(
            localStorage.getItem(
                "lurelle_token_expires_at"
            )
        ) || 0;


    if (
        !expiresAt ||
        Date.now() >= expiresAt - 30000
    ) {

        try {

            const response =
                await fetch(
                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=refresh_token",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_PUBLISHABLE_KEY

                        },

                        body: JSON.stringify({

                            refresh_token:
                                refreshToken

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                console.error(
                    "Session refresh failed:",
                    data
                );

                return null;

            }


            accessToken =
                data.access_token;


            localStorage.setItem(
                "lurelle_access_token",
                accessToken
            );


            if (data.refresh_token) {

                localStorage.setItem(
                    "lurelle_refresh_token",
                    data.refresh_token
                );

            }


            if (data.expires_in) {

                localStorage.setItem(
                    "lurelle_token_expires_at",
                    String(
                        Date.now() +
                        data.expires_in * 1000
                    )
                );

            }

        }

        catch (error) {

            console.error(error);

            return null;

        }

    }


    return accessToken;

}


/* =========================
   ADD PATTERN
========================= */

async function addPattern() {


    const name =
        document
        .getElementById("patternName")
        .value
        .trim();


    const description =
        document
        .getElementById("patternDescription")
        .value
        .trim();


    const instructions =
        document
        .getElementById("patternInstructions")
        .value
        .trim();


    if (
        !name ||
        !description ||
        !instructions
    ) {

        document
        .getElementById("message")
        .textContent =
            "Please fill in the pattern details first. ♡";

        return;

    }


    document
    .getElementById("message")
    .textContent =
        "Checking your Manager session... ♡";


    const accessToken =
        await getValidAccessToken();


    if (!accessToken) {

        document
        .getElementById("message")
        .textContent =
            "Please log in to the Manager first. ♡";

        return;

    }


    document
    .getElementById("message")
    .textContent =
        "Saving your pattern... ♡";


    try {


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/patterns",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Prefer":
                            "return=representation"

                    },

                    body: JSON.stringify({

                        name:
                            name,

                        description:
                            description,

                        instructions:
                            instructions

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(
                "Add pattern failed:",
                data
            );


            document
            .getElementById("message")
            .textContent =
                "Sorry, your pattern couldn't be saved. ♡";

            return;

        }


        document
        .getElementById("message")
        .textContent =
            "YAY! Your pattern was added. ♡";


        document
        .getElementById("patternName")
        .value = "";


        document
        .getElementById("patternDescription")
        .value = "";


        document
        .getElementById("patternInstructions")
        .value = "";


        document
        .getElementById("patternPhoto")
        .value = "";


        loadPatterns();

    }


    catch (error) {

        console.error(error);


        document
        .getElementById("message")
        .textContent =
            "Something went wrong. Please try again. ♡";

    }

}


/* =========================
   LOAD PATTERNS
========================= */

async function loadPatterns() {


    const patternList =
        document
        .getElementById("patternList");


    patternList.innerHTML =
        "<p class='loading-message'>Loading your patterns... ♡</p>";


    const accessToken =
        await getValidAccessToken();


    if (!accessToken) {

        patternList.innerHTML =
            "<p class='loading-message'>Please log in to the Manager first. ♡</p>";

        return;

    }


    try {


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/patterns?select=*&order=id.desc",
                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        const patterns =
            await response.json();


        if (!response.ok) {

            console.error(
                "Load patterns failed:",
                patterns
            );


            patternList.innerHTML =
                "<p class='loading-message'>We couldn't load your patterns right now. ♡</p>";

            return;

        }


        displayPatterns(patterns);

    }


    catch (error) {

        console.error(error);


        patternList.innerHTML =
            "<p class='loading-message'>Something went wrong while loading your patterns. ♡</p>";

    }

}


/* =========================
   DISPLAY PATTERNS
========================= */

function displayPatterns(patterns) {


    const patternList =
        document
        .getElementById("patternList");


    if (
        !patterns ||
        patterns.length === 0
    ) {

        patternList.innerHTML =
            "<p class='loading-message'>No patterns added yet. ♡</p>";

        return;

    }


    patternList.innerHTML = "";


    const grid =
        document.createElement("div");


    grid.className =
        "pattern-grid";


    patterns.forEach(
        function(pattern) {


            const card =
                document.createElement("div");


            card.className =
                "pattern-card";


            const title =
                document.createElement("h3");


            title.textContent =
                pattern.name;


            const description =
                document.createElement("p");


            description.className =
                "pattern-description";


            description.textContent =
                pattern.description;


            const instructions =
                document.createElement("div");


            instructions.className =
                "pattern-instructions";


            instructions.textContent =
                pattern.instructions;


            const actions =
                document.createElement("div");


            actions.className =
                "pattern-actions";


            const editButton =
                document.createElement("button");


            editButton.className =
                "edit-button";


            editButton.textContent =
                "✎ Edit";


            editButton.onclick =
                function() {

                    editPattern(
                        pattern.id
                    );

                };


            const deleteButton =
                document.createElement("button");


            deleteButton.className =
                "delete-button";


            deleteButton.textContent =
                "🗑 Delete";


            deleteButton.onclick =
                function() {

                    deletePattern(
                        pattern.id
                    );

                };


            actions.appendChild(
                editButton
            );


            actions.appendChild(
                deleteButton
            );


            card.appendChild(
                title
            );


            card.appendChild(
                description
            );


            card.appendChild(
                instructions
            );


            card.appendChild(
                actions
            );


            grid.appendChild(
                card
            );

        }
    );


    patternList.appendChild(
        grid
    );

}


/* =========================
   EDIT PATTERN
========================= */

async function editPattern(id) {


    const password =
        prompt(
            "Enter the manager password to edit this pattern:"
        );


    if (
        password !==
        PATTERN_MANAGER_PASSWORD
    ) {

        alert(
            "Incorrect password. ♡"
        );

        return;

    }


    const newName =
        prompt(
            "Pattern name:"
        );


    if (newName === null) {

        return;

    }


    const newDescription =
        prompt(
            "Short description:"
        );


    if (newDescription === null) {

        return;

    }


    const newInstructions =
        prompt(
            "Pattern instructions:"
        );


    if (newInstructions === null) {

        return;

    }


    const accessToken =
        await getValidAccessToken();


    if (!accessToken) {

        alert(
            "Please log in to the Manager first. ♡"
        );

        return;

    }


    try {


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/patterns?id=eq." +
                encodeURIComponent(id),
                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken,

                        "Prefer":
                            "return=representation"

                    },

                    body: JSON.stringify({

                        name:
                            newName.trim(),

                        description:
                            newDescription.trim(),

                        instructions:
                            newInstructions

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(data);


            alert(
                "The pattern couldn't be updated. ♡"
            );

            return;

        }


        alert(
            "Pattern updated successfully. ♡"
        );


        loadPatterns();

    }


    catch (error) {

        console.error(error);


        alert(
            "Something went wrong while editing the pattern. ♡"
        );

    }

}


/* =========================
   DELETE PATTERN
========================= */

async function deletePattern(id) {


    const password =
        prompt(
            "Enter the manager password to delete this pattern:"
        );


    if (
        password !==
        PATTERN_MANAGER_PASSWORD
    ) {

        alert(
            "Incorrect password. ♡"
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this pattern? ♡"
        );


    if (!confirmed) {

        return;

    }


    const accessToken =
        await getValidAccessToken();


    if (!accessToken) {

        alert(
            "Please log in to the Manager first. ♡"
        );

        return;

    }


    try {


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/patterns?id=eq." +
                encodeURIComponent(id),
                {

                    method: "DELETE",

                    headers: {

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }
            );


        if (!response.ok) {

            const data =
                await response.json();


            console.error(data);


            alert(
                "The pattern couldn't be deleted. ♡"
            );

            return;

        }


        alert(
            "Pattern deleted. ♡"
        );


        loadPatterns();

    }


    catch (error) {

        console.error(error);


        alert(
            "Something went wrong while deleting the pattern. ♡"
        );

    }

}


/* =========================
   LOAD WHEN PAGE OPENS
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadPatterns();

    }
);

</script>


</body>
</html>
