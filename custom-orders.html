<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="lurelle-butterfly.svg">
<title>Custom Orders | Lurelle by Adel</title>


<style>

/* =========================
   GENERAL PAGE
========================= */

body {
    background-color: #FFF8F3;
    color: #6F5A4D;
    font-family: Georgia, serif;
    margin: 0;
    padding: 0;
}


/* =========================
   HAMBURGER
========================= */

.menu-button {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1001;

    background-color: #DCC9BE;
    color: #FFF8F3;

    border: none;

    padding: 11px 17px;

    border-radius: 25px;

    font-size: 20px;

    cursor: pointer;

    transition:
        background-color 0.3s ease,
        transform 0.2s ease;
}


.menu-button:hover {
    background-color: #C98F9F;
}


/* =========================
   MENU
========================= */

#menu {
    position: fixed;

    top: 0;
    left: -270px;

    width: 250px;
    height: 100%;

    background-color: #FFF8F3;

    padding-top: 90px;

    box-shadow:
        5px 0 15px
        rgba(111,90,77,0.15);

    transition: left 0.4s ease;

    z-index: 1000;
}


#menu.open {
    left: 0;
}


#menu a {
    display: block;

    padding: 18px 25px;

    color: #6F5A4D;

    text-decoration: none;

    font-size: 18px;

    transition:
        background-color 0.2s ease,
        padding-left 0.2s ease;
}


#menu a:hover {
    background-color: #F7DCE1;
    padding-left: 32px;
}


/* =========================
   PAGE
========================= */

section {
    padding: 100px 20px;
    text-align: center;
}


h1 {
    font-size: 38px;
    font-weight: normal;
}


.intro {
    max-width: 650px;

    margin:
        0 auto
        40px auto;

    line-height: 1.7;

    font-size: 17px;
}


/* =========================
   CUSTOM ORDER CARD
========================= */

.order-card {
    max-width: 600px;

    margin: auto;

    padding: 35px;

    background-color: #F7DCE1;

    border-radius: 25px;

    box-sizing: border-box;
}


.order-card h2 {
    font-weight: normal;
}


/* =========================
   FORM
========================= */

.order-form {
    background-color: #FFF8F3;

    padding: 25px;

    border-radius: 20px;

    text-align: left;
}


.order-form label {
    display: block;

    margin-top: 17px;

    font-weight: bold;
}


.order-form input,
.order-form textarea {
    width: 100%;

    box-sizing: border-box;

    padding: 12px;

    margin-top: 6px;

    border:
        1px solid #DCC9BE;

    border-radius: 10px;

    background-color: #FFF8F3;

    color: #6F5A4D;

    font-family: Georgia, serif;
}


.order-form input:focus,
.order-form textarea:focus {
    outline: none;

    border-color: #C98F9F;
}


.order-form textarea {
    height: 120px;

    resize: vertical;
}


/* =========================
   SUBMIT BUTTON
========================= */

.submit-button {
    display: block;

    margin:
        25px auto
        0 auto;

    background-color: #6F5A4D;

    color: #FFF8F3;

    border: none;

    padding: 13px 25px;

    border-radius: 25px;

    cursor: pointer;

    font-family: Georgia, serif;

    font-size: 15px;

    transition:
        background-color 0.3s ease,
        transform 0.2s ease;
}


.submit-button:hover {
    background-color: #C98F9F;

    transform:
        translateY(-2px);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    section {
        padding:
            85px
            15px;
    }


    h1 {
        font-size: 30px;
    }


    .order-card {
        padding: 20px;
    }


    .order-form {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HAMBURGER BUTTON
========================= -->

<button
    class="menu-button"
    onclick="toggleMenu()"
    aria-label="Open menu">

    ☰

</button>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <a href="index.html">
        Home
    </a>

    <a href="about.html">
        About
    </a>

    <a href="blog.html">
        Blog🌸
    </a>

    <a href="patterns.html">
        Patterns🧶
    </a>

    <a href="collection.html">
        Collection
    </a>

    <a href="custom-orders.html">
        Custom Orders
    </a>

    <a href="contact.html">
        Contact
    </a>

</div>


<!-- =========================
     CUSTOM ORDERS
========================= -->

<section>


    <h1>
        ♡ Custom Orders
    </h1>


    <p class="intro">

        Have something specific in mind?

        Tell Lurelle what you're imagining and
        let's create something that's uniquely yours. 🧶

    </p>


    <div class="order-card">


        <h2>
            ✦ Create Something Custom
        </h2>


        <form
            class="order-form"
            onsubmit="submitCustomOrder(event)">


            <!-- NAME -->

            <label>
                Your name
            </label>

            <input
                type="text"
                id="customName"
                placeholder="Your name"
                required>


            <!-- EMAIL -->

            <label>
                Email
            </label>

            <input
                type="email"
                id="customEmail"
                placeholder="Your email"
                required>


            <!-- ITEM -->

            <label>
                What would you like made?
            </label>

            <input
                type="text"
                id="customItem"
                placeholder="e.g. ruffle hat, star bag, mini skirt..."
                required>


            <!-- COLOUR -->

            <label>
                Preferred colour
            </label>

            <input
                type="text"
                id="customColour"
                placeholder="e.g. ivory, pink, blue...">


            <!-- SIZE -->

            <label>
                Preferred size
            </label>

            <input
                type="text"
                id="customSize"
                placeholder="Tell us the size you need">


            <!-- DESCRIPTION -->

            <label>
                Tell us about your idea
            </label>

            <textarea
                id="customDescription"
                placeholder="Describe what you'd like..."></textarea>


            <!-- PHOTO -->

            <label>
                📸 Add a reference photo (optional)
            </label>

            <input
                type="file"
                id="customPhoto"
                accept="image/*"
                capture="environment">


            <!-- EXTRA NOTE -->

            <label>
                Anything else?
            </label>

            <textarea
                id="customNote"
                placeholder="Any extra details or requests?"></textarea>


            <!-- SUBMIT -->

            <button
                class="submit-button"
                type="submit">

                Send Custom Request

            </button>


        </form>

    </div>


</section>


<script>

/* =========================
   MENU
========================= */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList
        .toggle("open");

}


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://ljzydmylrayqdvuxtzps.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_RNQQFOqPdrKbLd6HiMSmwg_6UUNBZqg";


/* =========================
   SUBMIT CUSTOM ORDER
========================= */

async function submitCustomOrder(event) {

    event.preventDefault();


    /* =========================
       GET FORM VALUES
    ========================= */

    var name =
        document
            .getElementById("customName")
            .value
            .trim();


    var email =
        document
            .getElementById("customEmail")
            .value
            .trim();


    var item =
        document
            .getElementById("customItem")
            .value
            .trim();


    var colour =
        document
            .getElementById("customColour")
            .value
            .trim();


    var size =
        document
            .getElementById("customSize")
            .value
            .trim();


    var description =
        document
            .getElementById("customDescription")
            .value
            .trim();


    var note =
        document
            .getElementById("customNote")
            .value
            .trim();


    /* =========================
       BASIC VALIDATION
    ========================= */

    if (
        !name ||
        !email ||
        !item
    ) {

        alert(
            "Please fill in your name, email and item. ♡"
        );

        return;

    }


    try {


        /* =========================
           SEND ORDER TO SUPABASE
        ========================= */

        var response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/custom_order",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Prefer":
                            "return=minimal"

                    },

                    body: JSON.stringify({

                        name:
                            name,

                        email:
                            email,

                        item:
                            item,

                        colour:
                            colour,

                        size:
                            size,

                        description:
                            description,

                        photo_url:
                            null,

                        note:
                            note,

                        status:
                            "New"

                    })

                }
            );


        /* =========================
           CHECK SUPABASE RESPONSE
        ========================= */

        if (!response.ok) {

            var errorText =
                await response.text();


            console.error(
                "CUSTOM ORDER ERROR:",
                errorText
            );


            alert(
                "Sorry, your custom request could not be sent. Please try again. ♡"
            );


            return;

        }


        /* =========================
           SUCCESS
        ========================= */

        alert(
            "Thank you, " +
            name +
            "! Your custom request has been received. ♡"
        );


        /* =========================
           CLEAR FORM ONLY
           AFTER SUCCESS
        ========================= */

        document
            .querySelector(".order-form")
            .reset();


    }


    catch (error) {


        console.error(
            "CUSTOM ORDER ERROR:",
            error
        );


        alert(
            "Sorry, we couldn't send your custom request. Please try again. ♡"
        );

    }

}

</script>


</body>

</html>
