<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order | Lurelle by Adel</title>

<link rel="icon" type="image/svg+xml" href="lurelle-butterfly.svg">

<link rel="stylesheet" href="darkmode.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff8f3;
    color: #6f5a4d;
    font-family: Georgia, serif;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 35px 20px 70px;
}

.back {
    color: #6f5a4d;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin: 10px 0 8px;
}

.subtitle {
    text-align: center;
    margin: 0 0 30px;
}

.card {
    background: #fff;
    border: 1px solid #dcc9be;
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 22px;
    box-shadow: 0 6px 20px rgba(111, 90, 77, 0.08);
}

h2 {
    margin-top: 0;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 13px 0;
    border-bottom: 1px solid #eaded8;
}

.item:last-child {
    border-bottom: 0;
}

.summary {
    margin-top: 15px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 7px 0;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
    margin-top: 12px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    margin-top: 7px;
    padding: 13px;
    border: 1px solid #dcc9be;
    border-radius: 12px;
    background: #fff8f3;
    color: #6f5a4d;
    font-family: Georgia, serif;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    width: 100%;
    border: 0;
    border-radius: 30px;
    padding: 16px;
    margin-top: 20px;
    background: #6f5a4d;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #80675a;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.transfer-button {
    background: #c98f9f;
}

.transfer-button:hover {
    background: #b8798b;
}

.notice {
    padding: 15px;
    border-radius: 14px;
    margin-top: 15px;
    display: none;
    line-height: 1.5;
}

.notice.show {
    display: block;
}

.success {
    background: #e4f1e3;
    color: #4d704d;
}

.error {
    background: #f7dfdf;
    color: #8a5555;
}

.discount {
    background: #f8e4e8;
    border-radius: 14px;
    padding: 13px;
    margin-top: 12px;
}

.order-number {
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 15px;
}

.small {
    font-size: 14px;
    line-height: 1.6;
}

.payment-choice {
    margin-top: 25px;
}

.payment-choice h2 {
    margin-bottom: 8px;
}

.payment-choice p {
    line-height: 1.6;
}

.debug {
    display: none;
    white-space: pre-wrap;
    background: #f4eeee;
    padding: 12px;
    border-radius: 10px;
    font-size: 12px;
    overflow: auto;
}

@media (max-width: 600px) {

    main {
        padding: 25px 15px 60px;
    }

    h1 {
        font-size: 30px;
    }

    .card {
        padding: 22px;
    }

}

</style>

</head>


<body>

<main>

<a
    href="collection.html"
    class="back"
>
    ← Back to Collection
</a>


<h1>
    ♡ Lurelle Order
</h1>


<p class="subtitle">
    Almost yours ♡
</p>


<div class="card">

    <h2>
        Your Order
    </h2>

    <div
        id="orderNumber"
        class="order-number"
    >
        Order not saved yet
    </div>

    <div id="items">
        Loading order...
    </div>

    <div class="summary">

        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                ₦0
            </strong>

        </div>


        <div
            id="discountBox"
            class="discount"
            style="display:none"
        >
        </div>


        <div class="summary-row">

            <span>
                Discount
            </span>

            <strong id="discountAmount">
                ₦0
            </strong>

        </div>


        <div class="total">

            Total:
            <span id="total">
                ₦0
            </span>

        </div>

    </div>

</div>


<div class="card">

    <h2>
        Delivery Details
    </h2>


    <label>

        Full name

        <input
            id="customerName"
            type="text"
            autocomplete="name"
        >

    </label>


    <label>

        Email

        <input
            id="customerEmail"
            type="email"
            autocomplete="email"
        >

    </label>


    <label>

        Phone number

        <input
            id="customerPhone"
            type="tel"
            autocomplete="tel"
        >

    </label>


    <label>

        Delivery address

        <textarea
            id="deliveryAddress"
        ></textarea>

    </label>


    <label>

        Extra note

        <textarea
            id="customerNote"
            placeholder="Anything you'd like Lurelle to know?"
        ></textarea>

    </label>

</div>


<div class="card payment-choice">

    <h2>
        Save Your Order
    </h2>

    <p class="small">
        Choose how you'd like to pay. Your order will be saved with the payment method you select. ♡
    </p>


    <button
        id="cashButton"
        onclick="saveOrder('Cash')"
    >
        Save Order as Cash ♡
    </button>


    <button
        id="transferButton"
        class="transfer-button"
        onclick="saveOrder('Transfer')"
    >
        Save Order as Transfer ♡
    </button>


    <div
        id="orderStatus"
        class="notice"
    >
    </div>

</div>


<div
    id="debugBox"
    class="debug"
>
</div>


</main>


<script>

const SUPABASE_URL =
    "https://ljzydmylrayqdvuxtzps.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_RNQQFOqPdrKbLd6HiMSmwg_6UUNBZqg";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const checkout =
    JSON.parse(
        sessionStorage.getItem(
            "lurelleCheckout"
        ) || "null"
    );


function money(value) {

    return "₦" +
        Number(
            value || 0
        ).toLocaleString();

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


function currentMonth() {

    const d =
        new Date();

    return (
        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2, "0")
    );

}


function showNotice(
    element,
    text,
    type
) {

    element.textContent =
        text;

    element.className =
        "notice show " +
        type;

}


function getItems() {

    if (
        checkout &&
        Array.isArray(
            checkout.items
        )
    ) {

        return checkout.items;

    }

    return [];

}


function displayCheckout() {

    const items =
        getItems();

    const box =
        document.getElementById(
            "items"
        );


    if (!items.length) {

        box.innerHTML =
            "<p>No order items were found.</p>";

        document.getElementById(
            "cashButton"
        ).disabled = true;

        document.getElementById(
            "transferButton"
        ).disabled = true;

        return;

    }


    box.innerHTML = "";


    items.forEach(
        item => {

            const quantity =
                Number(
                    item.quantity ??
                    item.qty ??
                    1
                );


            const price =
                Number(
                    item.price ??
                    item.unit_price ??
                    0
                );


            const name =
                item.name ??
                item.title ??
                "Item";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "item";


            row.innerHTML =

                "<span>" +

                "<strong>" +

                escapeHTML(
                    name
                ) +

                "</strong>" +

                " × " +

                quantity +

                "</span>" +

                "<span>" +

                money(
                    price *
                    quantity
                ) +

                "</span>";


            box.appendChild(
                row
            );

        }
    );


    const subtotal =
        Number(
            checkout.subtotal ??
            checkout.subTotal ??

            items.reduce(
                (
                    sum,
                    item
                ) =>

                    sum +

                    Number(
                        item.price ??
                        item.unit_price ??
                        0
                    ) *

                    Number(
                        item.quantity ??
                        item.qty ??
                        1
                    ),

                0
            )
        );


    const discount =
        Number(
            checkout.discountAmount ??
            checkout.discount_amount ??
            checkout.discount ??
            0
        );


    const total =
        Number(
            checkout.total ??
            (
                subtotal -
                discount
            )
        );


    const rate =
        Number(
            checkout.discountRate ??
            checkout.discount_rate ??
            0
        );


    document.getElementById(
        "subtotal"
    ).textContent =
        money(subtotal);


    document.getElementById(
        "discountAmount"
    ).textContent =
        money(discount);


    document.getElementById(
        "total"
    ).textContent =
        money(total);


    if (discount > 0) {

        const discountBox =
            document.getElementById(
                "discountBox"
            );

        discountBox.style.display =
            "block";

        discountBox.textContent =
            "♡ Monthly discount: " +
            (
                rate * 100
            ) +
            "% off";

    }

}


async function saveOrder(
    paymentMethod
) {

    const cashButton =
        document.getElementById(
            "cashButton"
        );

    const transferButton =
        document.getElementById(
            "transferButton"
        );

    const status =
        document.getElementById(
            "orderStatus"
        );


    if (
        !checkout ||
        !getItems().length
    ) {

        showNotice(
            status,
            "No order was found to save.",
            "error"
        );

        return;

    }


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const customerEmail =
        document.getElementById(
            "customerEmail"
        ).value.trim();


    const customerPhone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const deliveryAddress =
        document.getElementById(
            "deliveryAddress"
        ).value.trim();


    const customerNote =
        document.getElementById(
            "customerNote"
        ).value.trim();


    if (
        !customerName ||
        !customerEmail ||
        !customerPhone ||
        !deliveryAddress
    ) {

        showNotice(
            status,
            "Please fill in your name, email, phone number and delivery address. ♡",
            "error"
        );

        return;

    }


    if (
        paymentMethod !== "Cash" &&
        paymentMethod !== "Transfer"
    ) {

        showNotice(
            status,
            "Please choose Cash or Transfer.",
            "error"
        );

        return;

    }


    cashButton.disabled =
        true;

    transferButton.disabled =
        true;


    if (
        paymentMethod === "Cash"
    ) {

        cashButton.textContent =
            "Saving Cash Order... ♡";

    } else {

        transferButton.textContent =
            "Saving Transfer Order... ♡";

    }


    const items =
        getItems();


    const subtotal =
        Number(
            checkout.subtotal ??
            checkout.subTotal ??

            items.reduce(
                (
                    sum,
                    item
                ) =>

                    sum +

                    Number(
                        item.price ??
                        item.unit_price ??
                        0
                    ) *

                    Number(
                        item.quantity ??
                        item.qty ??
                        1
                    ),

                0
            )
        );


    const discount =
        Number(
            checkout.discountAmount ??
            checkout.discount_amount ??
            checkout.discount ??
            0
        );


    const total =
        Number(
            checkout.total ??
            (
                subtotal -
                discount
            )
        );


    const rate =
        Number(
            checkout.discountRate ??
            checkout.discount_rate ??
            0
        );


    const orderData = {

        customer_name:
            customerName,

        customer_email:
            customerEmail,

        customer_phone:
            customerPhone,

        delivery_address:
            deliveryAddress,

        customer_note:
            customerNote,

        items:
            items,

        subtotal:
            subtotal,

        discount_rate:
            rate,

        discount_amount:
            discount,

        total:
            total,

        discount_month:
            checkout.discountMonth ??
            checkout.discount_month ??
            currentMonth(),

        payment_method:
            paymentMethod

    };


    try {

        const result =
            await supabaseClient
                .from("orders")
                .insert(
                    orderData
                );


        if (result.error) {

            throw result.error;

        }


        document.getElementById(
            "orderNumber"
        ).textContent =
            "Order saved successfully ♡";


        if (
            paymentMethod === "Cash"
        ) {

            showNotice(
                status,
                "♡ Your order has been saved as a Cash order!",
                "success"
            );


            cashButton.textContent =
                "Cash Order Saved ♡";


            transferButton.disabled =
                true;

        }


        if (
            paymentMethod === "Transfer"
        ) {

            showNotice(
                status,
                "♡ Your order has been saved as a Transfer order. Taking you to the transfer details...",
                "success"
            );


            transferButton.textContent =
                "Transfer Order Saved ♡";


            setTimeout(
                function() {

                    window.location.href =
                        "transfer.html";

                },
                1200
            );

        }

    }


    catch (error) {

        console.error(
            "SUPABASE ORDER ERROR:",
            error
        );


        const debugBox =
            document.getElementById(
                "debugBox"
            );


        debugBox.style.display =
            "block";


        debugBox.textContent =
            "SUPABASE ERROR:\n" +
            JSON.stringify(
                error,
                null,
                2
            );


        showNotice(
            status,
            "Your order could not be saved yet. Please try again. ♡",
            "error"
        );


        cashButton.disabled =
